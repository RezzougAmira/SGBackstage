# Configuration Netlify — hébergement statique du frontend React/Vite.
#
# Le site est construit depuis le dossier frontend/ et publié dans
# dist/. La redirection « catch-all » permet les routes React type
# /domaines/42 en accès direct (SPA routing).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
